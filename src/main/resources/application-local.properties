# Ambiente de desenvolvimento. Os valores padrão combinam com o docker-compose.yml e só valem na
# máquina de cada pessoa.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lab_simulacoes}
spring.datasource.username=${DB_USER:lab}
spring.datasource.password=${DB_PASSWORD:lab_local}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

management.endpoint.health.show-details=always
