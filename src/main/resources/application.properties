spring.application.name=lab-simulacoes-conversacionais

# Sem perfil informado, a aplicação usa o ambiente local. A homologação define SPRING_PROFILES_ACTIVE.
spring.profiles.default=local

# O esquema é só do Flyway: o Hibernate confere, mas nunca altera.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# As migrations têm data e hora no nome. Por isso, uma branch mesclada depois pode trazer uma
# migration mais antiga que a última aplicada, e ela precisa rodar mesmo assim.
spring.flyway.out-of-order=true
# Ao reverter para a imagem anterior, o banco tem migrations que essa imagem não conhece (RNF-12).
spring.flyway.ignore-migration-patterns=*:future

management.endpoints.web.exposure.include=health
